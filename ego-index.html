<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能装箱优化工具 / Smart Packing Optimizer</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f5f6fa; color: #2c3e50; height: 100vh; overflow: hidden; }
  .app { display: grid; grid-template-columns: 420px 1fr 360px; height: 100vh; }
  header { grid-column: 1 / -1; background: #1e2a44; color: #fff; padding: 10px 20px;
           display: flex; justify-content: space-between; align-items: center; }
  header h1 { font-size: 18px; font-weight: 600; }
  .lang-toggle { background: #2d3f5f; border: none; color: #fff; padding: 6px 14px;
                 border-radius: 4px; cursor: pointer; font-size: 13px; }
  .panel { background: #fff; overflow-y: auto; padding: 16px; border-right: 1px solid #e0e4e9; }
  .panel-right { border-right: none; border-left: 1px solid #e0e4e9; }
  .section { margin-bottom: 18px; }
  .section-title { font-size: 13px; font-weight: 600; color: #1e2a44; margin-bottom: 8px;
                   padding-bottom: 4px; border-bottom: 2px solid #3b6cf6; }
  label { display: block; font-size: 12px; color: #566580; margin-bottom: 4px; margin-top: 8px; }
  input[type="number"], input[type="text"], select {
    width: 100%; padding: 7px 9px; border: 1px solid #d0d7e0; border-radius: 4px;
    font-size: 13px; background: #fff; color: #1e2a44; font-weight: 500; }
  input::placeholder { color: #c0c8d4; font-style: italic; font-weight: 400; }
  input:focus, select:focus { outline: none; border-color: #3b6cf6; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr 28px; gap: 4px; align-items: end; }
  .btn { width: 100%; padding: 10px; background: #3b6cf6; color: #fff; border: none;
         border-radius: 5px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  .btn:hover { background: #2d5bd4; }
  .btn-sec { background: #6b7b95; }
  .btn-sec:hover { background: #556381; }
  .btn-small { padding: 6px 10px; font-size: 11px; margin: 0; width: auto; }
  .item-card { background: #f7f9fc; border: 1px solid #e0e4e9; border-radius: 5px;
               padding: 10px; margin-bottom: 10px; position: relative; border-left: 4px solid #3b6cf6; }
  .item-card .del { position: absolute; top: 6px; right: 6px; background: #ef4444;
                    color: #fff; border: none; border-radius: 3px; width: 22px; height: 22px;
                    cursor: pointer; font-size: 14px; line-height: 1; }
  .type-badge { display: inline-block; padding: 2px 8px; background: #3b6cf6; color: #fff;
                border-radius: 10px; font-size: 10px; font-weight: 600; margin-right: 6px; }
  .type-badge.stack { background: #10b981; }
  .type-badge.set { background: #f59e0b; }
  .single-check { display: flex; align-items: center; gap: 6px; margin-top: 6px;
                   font-size: 12px; color: #566580; cursor: pointer; }
  .single-check input { width: auto; }
  .add-buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
  .add-btn { padding: 8px 6px; font-size: 11px; border: 1px dashed #b8c1cf; background: #fff;
             border-radius: 5px; cursor: pointer; color: #425060; font-weight: 500; }
  .add-btn:hover { background: #f0f4fa; border-color: #3b6cf6; color: #3b6cf6; }
  .add-btn.std { border-color: #3b6cf6; color: #3b6cf6; }
  .add-btn.stk { border-color: #10b981; color: #10b981; }
  .add-btn.set { border-color: #f59e0b; color: #f59e0b; }
  .part-list { background: #eef2f8; padding: 8px; border-radius: 4px; margin-top: 6px; }
  .part-item { background: #fff; padding: 7px; margin-bottom: 6px; border-radius: 4px;
               border: 1px solid #d0dae8; position: relative; }
  .part-item .mini-del { position:absolute; right:4px; top:4px; width:18px; height:18px;
                          padding:0; font-size:11px; background:#ef4444; color:#fff; border:none;
                          border-radius:2px; cursor:pointer; }
  .sub-section { background: #eff4ff; padding: 8px; border-radius: 4px; margin-top: 6px; }
  #viewport { background: linear-gradient(135deg, #e8edf5 0%, #d4dce8 100%); position: relative; }
  #canvas { width: 100%; height: 100%; display: block; }
  .viewport-hint { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
                   background: rgba(30,42,68,.8); color: #fff; padding: 6px 14px;
                   border-radius: 16px; font-size: 11px; pointer-events: none; }
  .reset-btn { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,.95);
               border: 1px solid #d0d7e0; padding: 6px 12px; border-radius: 4px;
               cursor: pointer; font-size: 12px; }
  .result-box { background: #f7f9fc; border: 1px solid #d0dae8; border-radius: 6px;
                padding: 12px; margin-bottom: 10px; }
  .result-box h4 { font-size: 13px; margin-bottom: 6px; color: #1e2a44; }
  .result-row { display: flex; justify-content: space-between; font-size: 12px;
                padding: 3px 0; color: #425060; gap: 8px; }
  .result-row .val { font-weight: 600; color: #1e2a44; text-align: right; }
  .result-row.good .val { color: #10b981; }
  .result-row.warn .val { color: #f59e0b; }
  .progress { height: 6px; background: #e0e4e9; border-radius: 3px; overflow: hidden; margin: 4px 0; }
  .progress-bar { height: 100%; background: #3b6cf6; }
  .empty-state { color: #8b95a8; text-align: center; padding: 40px 20px; font-size: 13px; }
  .hint { font-size: 11px; color: #8b95a8; margin-top: 4px; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px;
         background: #e8f0fe; color: #3b6cf6; margin-right: 4px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 0; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); flex-shrink:0; }
  .container-card { cursor: pointer; padding: 10px; margin-bottom: 8px;
                    border: 2px solid #d0dae8; border-radius: 5px; background: #fff; transition:.15s; }
  .container-card:hover { border-color: #3b6cf6; }
  .container-card.selected { border-color: #3b6cf6; background: #eff4ff; }
  table.matrix { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.matrix th { text-align: right; padding: 6px 4px; border-bottom: 1px solid #d0d7e0;
                    color: #566580; font-weight: 600; }
  table.matrix th:first-child { text-align: left; }
  table.matrix td { padding: 6px 4px; border-bottom: 1px dashed #e8ecf3; }
  table.matrix td:not(:first-child) { text-align: right; font-weight: 600; }
  table.matrix tr.mix-row td { background: #eff4ff; color: #3b6cf6; font-weight: 700; }
  .steps-list { display: flex; flex-direction: column; gap: 4px; }
  .step-item { display: flex; align-items: flex-start; gap: 8px; padding: 6px 8px;
               background: #fff; border-radius: 4px; border: 1px solid #e8ecf3; }
  .step-num { display: flex; align-items: center; justify-content: center;
              width: 22px; height: 22px; min-width: 22px; border-radius: 50%;
              background: #3b6cf6; color: #fff; font-size: 11px; font-weight: 700; }
  .step-body { flex: 1; }
  .step-instr { font-size: 12px; color: #1e2a44; font-weight: 500; }
  .step-detail { font-size: 11px; color: #8b95a8; margin-top: 2px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>智能装箱优化工具 / Smart Packing Optimizer</h1>
    <button class="lang-toggle" onclick="toggleLang()"><span id="langLabel">English</span></button>
  </header>

  <!-- LEFT PANEL -->
  <div class="panel">
    <!-- Container config -->
    <div class="section">
      <div class="section-title" data-i18n="containerSec">集装箱 / Container</div>
      <label data-i18n="containerType">集装箱类型</label>
      <select id="containerType" onchange="onContainerChange()">
        <option value="auto" selected>🤖 自动推荐 / Auto (mix types)</option>
        <option value="20GP">20' GP — 589.8×235.2×239.3 cm</option>
        <option value="40GP">40' GP — 1203.2×235.2×239.3 cm</option>
        <option value="40HQ">40' HQ — 1203.2×235.2×269.8 cm</option>
        <option value="45HQ">45' HQ — 1360.8×235.2×269.8 cm</option>
        <option value="custom" data-i18n="custom">自定义 / Custom</option>
      </select>
      <div class="hint" id="autoHint" data-i18n="autoHint">自动组合 20GP/40GP/40HQ/45HQ 找最优搭配</div>
      <div class="row" id="customContainer" style="display:none;margin-top:6px">
        <div><label>L (cm)</label><input type="number" id="contL" placeholder="1203.2" onfocus="this.select()"></div>
        <div><label>W (cm)</label><input type="number" id="contW" placeholder="235.2" onfocus="this.select()"></div>
        <div><label>H (cm)</label><input type="number" id="contH" placeholder="269.8" onfocus="this.select()"></div>
      </div>
      <div class="row-2" style="margin-top:6px">
        <div><label data-i18n="maxH">限高 (cm)</label><input type="number" id="maxHeight" placeholder="auto" onfocus="this.select()"></div>
        <div><label data-i18n="cbmRate">装载率目标 %</label><input type="number" id="targetRate" placeholder="可选 / optional" onfocus="this.select()"></div>
      </div>
    </div>

    <!-- Products -->
    <div class="section">
      <div class="section-title" data-i18n="products">外箱明细 / Carton List</div>
      <div class="hint" data-i18n="productHint">添加各类外箱，系统统一装入同一批集装箱</div>
      <div id="productList"></div>
      <div class="add-buttons">
        <button class="add-btn std" onclick="addProduct('standard')">+ <span data-i18n="addStd">标准 Standard</span></button>
        <button class="add-btn stk" onclick="addProduct('stack')">+ <span data-i18n="addStk">叠装 Stack</span></button>
        <button class="add-btn set" onclick="addProduct('set')">+ <span data-i18n="addSet">套装 Set</span></button>
      </div>
    </div>

    <button class="btn" onclick="runOptimize()" data-i18n="optimize">计算最优方案 / Optimize</button>
  </div>

  <!-- CENTER 3D -->
  <div id="viewport">
    <canvas id="canvas"></canvas>
    <div class="viewport-hint" data-i18n="ready">拖动旋转 · 滚轮缩放 · 右键平移</div>
    <div style="position:absolute;top:10px;right:10px;display:flex;gap:6px">
      <button class="reset-btn" onclick="resetView()" data-i18n="resetView">复位视角 / Reset</button>
      <button class="reset-btn" onclick="exportPNG()">📷 PNG</button>
    </div>
  </div>

  <!-- RIGHT RESULTS -->
  <div class="panel panel-right">
    <div class="section-title" style="margin-bottom:12px" data-i18n="resultTitle">装箱方案 / Results</div>
    <div id="results">
      <div class="empty-state" data-i18n="noResult">
        请在左侧添加外箱，点击"计算最优方案"<br><br>
        Add cartons on the left and click "Optimize"
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="app.js"></script>
</body>
</html>
