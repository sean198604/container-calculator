services:
  container-calculator:
    build: .
    container_name: container-calculator-7002
    ports:
      - "7002:7002"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      # 内网 7002 使用 EGO International 品牌（EGO_BRAND=true → ego-index.html）
      # GitHub 公开部署（无此变量）默认 SEAN 版 index.html
      - EGO_BRAND=true
    networks:
      - container-calculator_default

networks:
  container-calculator_default:
    external: true
